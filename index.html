<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金塊代購進度查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1d2733;--mute:#66727f;--line:#d9dfe5;--gold:#a87b0a;--goldbg:#f6ecd0;--ok:#1f7a55;--okbg:#dcf1e6;--wait:#8a5a00;--waitbg:#fbe9c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--ink:#e9edf1;--mute:#9aa6b2;--line:#2c3541;--gold:#e0b84a;--goldbg:#3a3015;--ok:#6fd1a2;--okbg:#17372a;--wait:#f0c36a;--waitbg:#3d2f10}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--ink:#e9edf1;--mute:#9aa6b2;--line:#2c3541;--gold:#e0b84a;--goldbg:#3a3015;--ok:#6fd1a2;--okbg:#17372a;--wait:#f0c36a;--waitbg:#3d2f10}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:680px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 24px;font-size:14px}
.find{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:28px}
.find label{display:block;font-weight:500;margin-bottom:8px}
.find input{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.find input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#mine{margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row small{display:block;color:var(--mute)}
.none{color:var(--mute);margin:6px 0 0;font-size:14px}
h2{font-size:17px;margin:0 0 12px}
.item{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:15px 16px;margin-bottom:12px}
.item.paid{border-left-color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-weight:700;font-size:17px}
.meta{color:var(--mute);font-size:14px;margin-top:2px}
.tag{flex:none;font-size:13px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--waitbg);color:var(--wait)}
.paid .tag{background:var(--okbg);color:var(--ok)}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:14px}
.facts b{font-weight:700}
.pic{flex:none;width:140px;height:170px;border-radius:10px;overflow:hidden;background:var(--goldbg);display:grid;place-items:center;font-size:30px}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.body{flex:1;min-width:0}
@media (max-width:480px){.item{flex-direction:column}.pic{width:100%;height:280px}}
.note{color:var(--mute);font-size:13px;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>金塊代購進度查詢</h1>
<p class="sub">輸入你的名字,查看你訂的品項與收款狀態。</p>

<section class="find">
  <label for="q">你的名字</label>
  <input id="q" type="text" placeholder="例如:irene" autocomplete="off">
  <div id="mine"></div>
</section>

<h2>所有品項</h2>
<div id="items"></div>
<p class="note">價格為預估價,實際以到貨成本為準。已收款的單不需再付款。</p>
</main>

function sum(o){var n=0;for(var k in o)n+=o[k];return n}
function money(n){return "$"+n.toLocaleString("en-US")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

document.getElementById("items").innerHTML=ITEMS.map(function(it){
  var n=sum(it.buyers);
  var f='<span>規格 <b>'+it.g+'g</b></span><span>總數 <b>'+n+'</b></span>';
  if(!it.paid)f+='<span>預估單價 <b>'+money(it.price)+'</b></span>';
  if(it.eta)f+='<span>'+esc(it.eta)+'</span>';
  return '<div class="item'+(it.paid?' paid':'')+'"><div class="pic">'+(it.img?'<img src="'+it.img+'" alt="'+esc(it.name)+'">':'🪙')+'</div><div class="body"><div class="top"><div><div class="name">'+esc(it.name)+'</div>'+
    '<div class="meta">'+(it.id?'單號 '+it.id:'尚未編號')+'</div></div>'+
    '<span class="tag">'+(it.paid?'收款完成':'待收款')+'</span></div><div class="facts">'+f+'</div></div></div>';
}).join("");

var q=document.getElementById("q"),mine=document.getElementById("mine");
q.addEventListener("input",function(){
  var key=q.value.trim().toLowerCase();
  if(!key){mine.innerHTML="";return}
  var rows=[],due=0,found=false;
  ITEMS.forEach(function(it){
    for(var b in it.buyers){
      if(b.toLowerCase()===key){
        found=true;var c=it.buyers[b];
        if(!it.paid)due+=c*it.price;
        rows.push('<div class="row"><div>'+esc(it.name)+'<small>'+(it.id?'單號 '+it.id+' · ':'')+it.g+'g × '+c+(it.eta?' · '+esc(it.eta):'')+'</small></div>'+
          '<div>'+(it.paid?'<span style="color:var(--ok)">已收款</span>':'待收款<small>預估 '+money(c*it.price)+'</small>')+'</div></div>');
      }
    }
  });
  mine.innerHTML=found?rows.join("")+(due?'<div class="row"><div><b>待收款預估合計</b></div><div><b>'+money(due)+'</b></div></div>':''):'<p class="none">找不到「'+esc(q.value.trim())+'」的訂單,請確認名字拼寫。</p>';
});
